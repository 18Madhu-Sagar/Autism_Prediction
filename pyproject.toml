[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autism-prediction"
version = "1.0.0"
description = "Autism Prediction Flask Application"
requires-python = ">=3.8"
dependencies = [
    "Flask==3.0.0",
    "scikit-learn==1.3.2",
    "numpy==1.24.3",
    "pandas==2.0.3",
    "xgboost==2.0.3",
    "Werkzeug==3.0.1",
] 