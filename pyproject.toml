[build-system]
requires = ["setuptools>=69.0.0", "wheel", "Cython>=3.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autism-prediction"
version = "1.0.0"
description = "Autism Prediction Flask Application"
requires-python = ">=3.12"
dependencies = [
    "Flask==3.0.0",
    "scikit-learn==1.4.0",
    "numpy==1.26.4",
    "pandas==2.2.0",
    "xgboost==2.0.3",
    "Werkzeug==3.0.1",
    "Cython>=3.0.0",
] 